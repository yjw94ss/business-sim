<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="description" content="生意人 · 经营对话 —— 24 个月，你和店员、会计、供货商、房东的每一次对话，都是一次商业决策。"/>
<title>生意人 · 经营对话</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070910; --win:#0d1117; --bub:#161d26; --line:#222c38; --line2:#2f3c4c;
  --txt:#e4eaf2; --dim:#8b98a8; --dim2:#5e6b7c;
  --gold:#f3b544; --gold2:#ffd479; --cyan:#48c8ef; --red:#f2565c; --grn:#2ecf8f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 500px at 15% -10%, #16222f 0%, transparent 60%),
    radial-gradient(800px 460px at 88% 0%, #1d1626 0%, transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.55;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  display:grid;place-items:center;
}

/* ============ 游戏窗口 ============ */
.game{
  width:min(940px,100%);height:min(950px,100dvh);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--win),#0a0e14);
  border:1px solid var(--line2);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 120px -40px #000,0 0 0 1px #ffffff08 inset;
  position:relative;
}
@media (max-width:940px),(max-height:920px){
  .game{height:100dvh;border-radius:0;border:0}
}

/* ---------- 顶栏 ---------- */
.titlebar{
  flex:none;display:flex;align-items:center;gap:11px;padding:10px 14px;
  background:linear-gradient(180deg,#141c26,#0f141b);
  border-bottom:1px solid var(--line);position:relative;
}
.titlebar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,#f3b54460,transparent);pointer-events:none;
}
.logo{
  width:33px;height:33px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#ffcf6b,#d9931f);color:#1a1206;font-weight:800;font-size:16px;
  box-shadow:0 0 0 1px #ffd47940,0 6px 16px -6px #f3b54470;
}
.tb-title h1{font-size:14px;font-weight:700;letter-spacing:.4px;line-height:1.2}
.tb-title p{font-size:8px;color:var(--dim2);letter-spacing:1.4px;font-family:var(--mono)}
.chips{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{
  display:flex;flex-direction:column;padding:3px 8px;border-radius:8px;
  background:#0a0e14;border:1px solid var(--line);min-width:62px;
}
.chip span{font-size:8px;color:var(--dim2);letter-spacing:.4px;line-height:1.3}
.chip b{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:-.2px}
.gold{color:var(--gold)}.cyan{color:var(--cyan)}.red{color:var(--red)}.grn{color:var(--grn)}
.icon-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:#0a0e14;
  color:var(--dim);font-size:13px;cursor:pointer;font-family:inherit;flex:none;transition:.15s;align-self:center;
}
.icon-btn:hover{color:var(--gold);border-color:var(--gold)}

/* ---------- 消息流 ---------- */
.stream{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 24px;
  display:flex;flex-direction:column;
  background:radial-gradient(700px 300px at 50% 0%,#131b25 0%,transparent 70%);
  scroll-behavior:smooth;
}
.stream::-webkit-scrollbar{width:7px}
.stream::-webkit-scrollbar-thumb{background:#232c38;border-radius:4px}
.stream::-webkit-scrollbar-track{background:transparent}

.msg{display:flex;gap:9px;margin-bottom:12px;animation:rise .28s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.av{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  font-size:12px;font-weight:700;margin-top:2px;box-shadow:0 0 0 1px #ffffff0d inset;
}
img.av{object-fit:cover;object-position:center 18%;background:#12161c;box-shadow:0 0 0 1px #ffffff14 inset}

/* 门店 chip */
.chip.shop{cursor:pointer;transition:.15s;border-color:#3a3016}
.chip.shop:hover{border-color:var(--gold);background:#171208}
.chip.shop b{color:var(--gold)}

.bub{
  max-width:min(78%,560px);background:var(--bub);border:1px solid var(--line);
  border-radius:13px;padding:9px 12px;font-size:13px;line-height:1.65;
  box-shadow:0 6px 18px -14px #000;
}
.msg.wide .bub{max-width:calc(100% - 40px);width:calc(100% - 40px)}
.msg.me .bub{
  background:linear-gradient(180deg,#2e2411,#241c0d);border-color:#4a3a17;color:#ffe8bb;
  border-bottom-right-radius:4px;
}
.msg:not(.me) .bub{border-bottom-left-radius:4px}
.who{font-size:10px;color:var(--dim2);margin-bottom:3px;display:flex;gap:6px;align-items:center;letter-spacing:.3px}
.who i{font-style:normal;opacity:.62;font-size:9px}
.bub b{color:var(--gold2);font-weight:600}
.c-red{color:var(--red)}.c-grn{color:var(--grn)}

/* 输入中 */
.typing{display:flex;gap:5px;align-items:center;padding:13px 15px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim2);animation:blink 1.15s infinite}
.typing i:nth-child(2){animation-delay:.17s}
.typing i:nth-child(3){animation-delay:.34s}
@keyframes blink{0%,60%,100%{opacity:.22;transform:translateY(0)}30%{opacity:1;transform:translateY(-2.5px)}}

.divider{display:flex;align-items:center;gap:10px;margin:14px 0 14px;animation:rise .3s}.divider::before,.divider::after{content:"";flex:1;height:1px}
.divider::before{background:linear-gradient(90deg,transparent,var(--line2))}
.divider::after{background:linear-gradient(90deg,var(--line2),transparent)}
.divider span{
  font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;color:var(--dim);
  padding:3px 10px;border:1px solid var(--line);border-radius:20px;background:#0a0e14;white-space:nowrap;
}

/* ---------- 决策卡 ---------- */
.card{
  border:1px solid #3a3016;border-radius:13px;background:linear-gradient(180deg,#151a20,#10151b);
  overflow:hidden;box-shadow:0 0 0 1px #f3b5440d,0 18px 40px -30px #000;
}
.card-h{
  display:flex;align-items:center;gap:7px;padding:8px 12px;
  background:linear-gradient(90deg,#1e2015,#151a20);border-bottom:1px solid #33290f;
  font-size:11.5px;font-weight:600;letter-spacing:.4px;color:var(--gold2);
}
.card-h .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);flex:none}
.card-h .sp{margin-left:auto;font-size:9.5px;color:var(--dim2);font-family:var(--mono);letter-spacing:0}
.card-b{padding:10px 11px 11px}

.skus{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media (max-width:700px){.skus{grid-template-columns:1fr;gap:6px}}
.sku{background:#0a0e13;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.sku-top{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.sku-img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:none;display:block;background:#0a0e13;filter:brightness(1.12)}
.sku-t{min-width:0}
.sku-t b{display:block;font-size:12px;line-height:1.35}
.sku-t i{font-style:normal;font-size:9px;color:var(--dim2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scene{width:100%;height:300px;object-fit:cover;object-position:center 45%;border-radius:10px;display:block;margin-bottom:9px;border:1px solid var(--line);cursor:pointer;transition:.15s}
.scene:hover{filter:brightness(1.1)}
@media (max-width:700px){.scene{height:200px}}
.sku-in{display:flex;gap:6px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:9px;color:var(--dim2);margin-bottom:2px}
.fld input{
  width:100%;padding:5px 6px;border-radius:6px;border:1px solid var(--line2);background:#070a0e;
  color:var(--txt);font-family:var(--mono);font-size:12.5px;text-align:right;outline:none;transition:.15s;
}
.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 2px #f3b54422}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sku-f{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:9.5px;color:var(--dim);font-family:var(--mono)}

.ctrls{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.ctrl{flex:1 1 44%;min-width:150px;display:flex;align-items:center;gap:8px}
.ctrl>label{font-size:10.5px;color:var(--dim);flex:none}
.ctrl .v{font-family:var(--mono);font-size:11.5px;color:var(--gold);min-width:56px;text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:56px;height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--gold) var(--p,0%),#243040 var(--p,0%));outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold2);
  border:2px solid #151108;box-shadow:0 0 0 1px #f3b54480,0 2px 6px #000;cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:2px solid #151108;border-radius:50%;background:var(--gold2)}
.stepper{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;background:#070a0e}
.stepper button{width:26px;height:26px;background:transparent;border:0;color:var(--dim);font-size:15px;cursor:pointer;line-height:1;transition:.15s}
.stepper button:hover{background:#1b222b;color:var(--gold)}
.stepper b{width:28px;display:grid;place-items:center;font-family:var(--mono);font-size:12px}

.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mini{
  padding:6px 10px;border-radius:7px;border:1px solid var(--line2);background:#0d1319;color:var(--dim);
  font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;
}
.mini:hover:not(:disabled){color:var(--gold);border-color:#4a3a17;background:#151a12}
.mini:disabled{opacity:.35;cursor:not-allowed}

.calc{margin-top:9px;font-size:11px;color:var(--dim);font-family:var(--mono);line-height:1.6}
.calc b{color:var(--gold)}
.calc b.c-red{color:var(--red)}
.primary{
  width:100%;margin-top:9px;padding:11px;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#ffcb5c,#e09b21);color:#1a1206;font-weight:800;font-size:13.5px;
  letter-spacing:1.6px;font-family:inherit;box-shadow:0 8px 22px -10px #f3b54499;transition:.15s;
}
.primary:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.primary:disabled{filter:grayscale(.7);opacity:.5;cursor:not-allowed;transform:none}

/* ---------- 报表 ---------- */
.rep-g{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
@media (max-width:480px){.rep-g{grid-template-columns:repeat(2,1fr)}}
.rep-i{background:#0a0e13;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.rep-i span{display:block;font-size:9px;color:var(--dim2);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-i b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.rep canvas{width:100%;height:74px;display:block;margin-top:7px}
.rep2{display:flex;gap:12px;font-size:9.5px;color:var(--dim2);margin-top:5px;flex-wrap:wrap}
.rep2 i{display:inline-block;width:10px;height:2.5px;border-radius:2px;margin-right:4px;vertical-align:2px}

/* 事件 */
.ev-t{font-weight:700;font-size:13px;margin-bottom:3px}
.ev-d{font-size:12px;color:var(--dim);line-height:1.65;margin-bottom:9px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{
  display:block;width:100%;text-align:left;padding:8px 11px;border-radius:8px;
  border:1px solid var(--line2);background:#0b1016;color:var(--txt);font-size:12px;cursor:pointer;
  font-family:inherit;line-height:1.45;transition:.15s;
}
.opt:hover:not(:disabled){border-color:var(--gold);background:#151a12;transform:translateX(2px)}
.opt small{display:block;color:var(--dim2);font-size:10.5px;margin-top:1px}
.opt:disabled{opacity:.4;cursor:default}
.opt.picked{border-color:var(--gold);background:#1c1a0e;opacity:1}
.ev-r{font-size:12.5px;color:var(--dim);line-height:1.65}
.ev-r b{color:var(--gold2)}

.toast{
  position:fixed;left:50%;top:72px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  background:#1d232b;border:1px solid var(--line2);border-left:3px solid var(--red);
  padding:9px 15px;border-radius:9px;font-size:12px;box-shadow:0 18px 50px -18px #000;
  transition:.25s;z-index:90;max-width:86vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-left-color:var(--gold)}
@media (max-width:700px){.toast{top:64px;font-size:11.5px;padding:8px 13px;max-width:92vw}}

.overlay{
  position:fixed;inset:0;background:rgba(4,6,9,.84);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;padding:18px;z-index:100;
}
.overlay.show{display:flex}
.modal{
  width:100%;max-width:520px;max-height:86vh;overflow:auto;border-radius:16px;
  background:linear-gradient(180deg,#141a21,#0e1217);border:1px solid var(--line2);
  padding:20px;box-shadow:0 40px 90px -30px #000;animation:rise .22s ease-out;
}
.eyebrow{font-size:9.5px;letter-spacing:2.2px;color:var(--gold);font-family:var(--mono);margin-bottom:6px}
.modal h3{font-size:16px;margin-bottom:10px;font-weight:700}
.grade{text-align:center;padding:10px 0 8px}
.grade .g{font-size:26px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(180deg,#ffe1a1,#e2a02a);-webkit-background-clip:text;background-clip:text;color:transparent}
.grade .s{font-size:9.5px;color:var(--dim2);letter-spacing:2.2px;font-family:var(--mono);margin-top:3px}
.big{font-family:var(--mono);font-size:28px;font-weight:700;text-align:center;margin:4px 0 1px;letter-spacing:-1px}
.bigsub{text-align:center;font-size:11px;color:var(--dim2);margin-bottom:13px;line-height:1.7}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:11px}
.diag{display:flex;flex-direction:column;gap:6px}
.tip{padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.6;background:#0b0f14;border:1px solid var(--line);border-left-width:3px;color:var(--dim)}
.tip.warn{border-left-color:var(--red)}
.tip.good{border-left-color:var(--grn)}
.tip.info{border-left-color:var(--cyan)}
.tip b{color:var(--gold2)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.lc{background:#0b0f14;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.lc h4{font-size:11.5px;margin-bottom:4px;color:var(--gold2)}
.lc p{font-size:10.5px;color:var(--dim);line-height:1.65}
.lc p b{color:var(--txt)}
.close{width:100%;margin-top:13px;padding:11px;border-radius:10px;border:0;background:#1d232b;color:var(--txt);font-size:13px;cursor:pointer;font-family:inherit}
.close:hover{background:#252d37}
</style>
</head>
<body>

<div class="game">
  <header class="titlebar">
    <div class="logo">生</div>
    <div class="tb-title">
      <h1>生意人</h1>
      <p>BUSINESS DIALOGUE</p>
    </div>
    <div class="chips">
      <div class="chip"><span>月份</span><b id="hMonth">1/24</b></div>
      <div class="chip"><span>现金</span><b class="gold" id="hCash">¥60,000</b></div>
      <div class="chip"><span>净资产</span><b class="cyan" id="hNet">¥65,368</b></div>
      <div class="chip" id="chipDebt" style="display:none"><span>负债</span><b id="hDebt">¥0</b></div>
      <div class="chip"><span>口碑</span><b id="hRep">65</b></div>
      <button class="chip shop" id="btnShop" title="查看门店"><span>门店</span><b id="shopLv">LV.0</b></button>
      <button class="icon-btn" id="btnLore" title="商业心法">?</button>
    </div>
  </header>
  <main class="stream" id="stream"></main>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function () {
  "use strict";

  /* ================= 常量 ================= */
  const MAX_MONTH = 24;
  const START_CASH = 60000;
  const START_REP = 65;
  const START_INV = { A: 120, B: 50, C: 12 };

  const SKUS = [
    { id: "A", name: "基础款", tag: "白瓷杯 · 引流 · 高敏感", cost: 16,  ref: 34,  base: 320, e: 1.9,  img: "assets/sku_a.webp" },
    { id: "B", name: "升级款", tag: "手冲套装 · 主力 · 中敏感", cost: 44,  ref: 95,  base: 130, e: 1.7,  img: "assets/sku_b.webp" },
    { id: "C", name: "旗舰款", tag: "黄铜礼盒 · 利润 · 低敏感", cost: 104, ref: 260, base: 32,  e: 1.55, img: "assets/sku_c.webp" }
  ];

  const WAGE = 3200, CAP_PER_STAFF = 250, CAP_BASE = 30, CAP_PER_LEVEL = 80;
  const BASE_RENT = 2400, RENT_PER_LVL = 400;
  const HOLD_RATE = 0.015, LOAN_RATE = 0.012, LOAN_LIMIT = 150000;
  const MKT_CARRY = 0.4;
  const UP_COST = [12000, 26000, 44000];
  const UP_DEMAND = 0.22;
  const MAX_LEVEL = 3;

  /* ================= 工具 ================= */
  const el = id => document.getElementById(id);
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const fmt = n => (n < 0 ? "-" : "") + Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const money = n => "¥" + fmt(n);
  const pct = (v, d) => (v * 100).toFixed(d === undefined ? 0 : d) + "%";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const CHARS = {
    zhen: { name: "阿珍", role: "店长助理", av: "珍", bg: "#3a2e12", fg: "#f3b544", img: "assets/zhen.webp" },
    lin:  { name: "小林", role: "会计",     av: "林", bg: "#12303a", fg: "#48c8ef", img: "assets/lin.webp" },
    zhou: { name: "老周", role: "商业顾问", av: "周", bg: "#12332a", fg: "#2ecf8f", img: "assets/zhou.webp" },
    chen: { name: "陈老板", role: "供货商", av: "陈", bg: "#2b2142", fg: "#b08cf0", img: "assets/chen.webp" },
    fang: { name: "房东", role: "",         av: "房", bg: "#3a2020", fg: "#f2565c", img: "assets/fang.webp" },
    bo:   { name: "阿May", role: "本地博主", av: "M", bg: "#3a1f30", fg: "#ff8fc4", img: "assets/bo.webp" },
    sys:  { name: "系统", role: "",         av: "·", bg: "#232b35", fg: "#8a97a8" },
    me:   { name: "我", role: "",           av: "我", bg: "#4a3a17", fg: "#ffd479" }
  };

  let S = null, busy = false, cardNode = null, chartSeq = 0, toastTimer = null;

  function toast(msg, kind) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.toggle("ok", kind === "ok");
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
  }

  /* ================= 状态 ================= */
  function startNet() { return START_CASH + START_INV.A * 16 + START_INV.B * 44 + START_INV.C * 104; }

  function newState() {
    return {
      month: 1, cash: START_CASH, debt: 0, rep: START_REP,
      inv: { A: START_INV.A, B: START_INV.B, C: START_INV.C },
      prices: { A: 34, B: 95, C: 260 },
      lastOrder: { A: 170, B: 70, C: 18 },
      staff: 2, level: 0, mktStock: 0, compIndex: 1.0,
      wageMul: 1, rentAdd: 0, mods: [], seen: {},
      history: [{ month: 0, cash: START_CASH, net: startNet(), profit: 0 }],
      totals: { revenue: 0, profit: 0, cogs: 0, lost: 0, mkt: 0, units: 0, capex: 0, extra: 0 },
      peakNet: startNet(), gameOver: false
    };
  }

  /* ================= 派生 ================= */
  function invValue() { return SKUS.reduce((a, s) => a + S.inv[s.id] * s.cost, 0); }
  function invUnits() { return Math.round(SKUS.reduce((a, s) => a + S.inv[s.id], 0)); }
  function netWorth() { return S.cash + invValue() - S.debt; }
  function rentNow() { return BASE_RENT + S.level * RENT_PER_LVL + S.rentAdd; }
  function wageNow() { return S.staff * WAGE * S.wageMul; }
  function mulOf(t) { return S.mods.reduce((a, m) => m.target === t ? a * m.value : a, 1); }
  function addMod(t, v, mo, label) { S.mods.push({ target: t, value: v, left: mo, label }); }
  function payExtra(a) { S.cash -= a; S.totals.extra += a; }
  function capacity() {
    return Math.round((S.staff * CAP_PER_STAFF + CAP_BASE + S.level * CAP_PER_LEVEL) * mulOf("capacity"));
  }

  function demandFor(sku, price, mktEff, noise) {
    const nz = noise === undefined ? 1 : noise;
    const refEff = sku.ref * S.compIndex;
    const priceFactor = Math.pow(Math.max(price, 1) / refEff, -sku.e);
    const mktFactor = 1 + 0.28 * Math.log2(1 + mktEff / 3000);
    const repFactor = 0.6 + S.rep * 0.008;
    const season = 1 + 0.2 * Math.sin((S.month - 4) * Math.PI / 6);
    const storeMul = 1 + S.level * UP_DEMAND;
    return Math.max(0, sku.base * priceFactor * mktFactor * repFactor * season * storeMul * mulOf("demand") * nz);
  }

  /* ================= HUD ================= */
  function renderHud() {
    el("hMonth").textContent = Math.min(S.month, MAX_MONTH) + "/" + MAX_MONTH;
    el("hCash").textContent = money(S.cash);

    const nw = netWorth();
    el("hNet").textContent = money(nw);
    el("hNet").className = nw < 60000 ? "red" : "cyan";
    el("hDebt").textContent = money(S.debt);
    el("hDebt").className = S.debt > 0 ? "red" : "";
    el("chipDebt").style.display = S.debt > 0 ? "" : "none";
    el("hRep").textContent = Math.round(S.rep);
    el("hRep").className = S.rep < 45 ? "red" : (S.rep > 78 ? "grn" : "");
  }

  const SHOP_NAMES = ["街边小店", "翻新小铺", "双层门店", "旗舰店"];

  /* ================= 消息流 ================= */
  function scrollDown() {
    const st = el("stream");
    setTimeout(() => { if (st) st.scrollTop = st.scrollHeight; }, 40);
  }

  function avatarEl(c) {
    if (c.img) {
      const img = document.createElement("img");
      img.className = "av";
      img.src = c.img;
      img.alt = c.name;
      img.addEventListener("error", function () {
        const d = document.createElement("div");
        d.className = "av";
        d.style.background = c.bg;
        d.style.color = c.fg;
        d.textContent = c.av;
        if (img.parentNode) img.parentNode.replaceChild(d, img);
      });
      return img;
    }
    const d = document.createElement("div");
    d.className = "av";
    d.style.background = c.bg;
    d.style.color = c.fg;
    d.textContent = c.av;

  function push(role, html, opts) {
    opts = opts || {};
    const c = CHARS[role] || CHARS.sys;
    const wrap = document.createElement("div");
    wrap.className = "msg" + (role === "me" ? " me" : "") + (opts.wide ? " wide" : "");
    wrap.appendChild(avatarEl(c));
    const bub = document.createElement("div");

      (role === "me" ? "" : '<div class="who">' + c.name + (c.role ? "<i>" + c.role + "</i>" : "") + "</div>") + html;
    wrap.appendChild(bub);
    if (opts.before && opts.before.parentNode) {
      opts.before.parentNode.insertBefore(wrap, opts.before);
    } else {
      el("stream").appendChild(wrap);
      scrollDown();

    return wrap;

  function scrollToEl(node) {
    const st = el("stream");

  /* ================= 预测 ================= */
  function forecast(mktEff) {
    const out = {};
    let total = 0;
    SKUS.forEach(s => {
      const d = demandFor(s, S.prices[s.id], mktEff, 1);
      out[s.id] = d;
      total += d;
    });
    out.__total = total;
    return out;
  }

  function bindCard() {
    cardNode.addEventListener("input", e => { if (e.target.tagName === "INPUT") updateCard(); });

    el("d_mkt").addEventListener("input", () => {

    el("d_sPlus").addEventListener("click", () => {

    el("d_sMinus").addEventListener("click", () => {
      if (S.staff <= 1) { toast("总得留一个人看店。"); return; }

    });

    el("d_fill").addEventListener("click", () => {
      const f = forecast(effMkt());
      SKUS.forEach(s => { el("d_order_" + s.id).value = Math.round(f[s.id] * 1.05 / 10) * 10; });
      updateCard();

    });

    el("d_last").addEventListener("click", () => {
      SKUS.forEach(s => { el("d_order_" + s.id).value = S.lastOrder[s.id] || 0; });

    });

    el("d_borrow").addEventListener("click", () => {
      const amt = Math.min(20000, LOAN_LIMIT - S.debt);
      if (amt <= 0) { toast("授信已用满（上限 " + money(LOAN_LIMIT) + "）。"); return; }
      S.debt += amt; S.cash += amt;
      renderHud(); updateCard();
      toast("借入 " + money(amt) + "，每月利息 " + money(S.debt * LOAN_RATE) + "。", "ok");
    });

    el("d_repay").addEventListener("click", () => {
      if (S.debt <= 0) { toast("目前没有负债。"); return; }
      const amt = Math.min(20000, S.debt);

      S.debt -= amt; S.cash -= amt;

      toast("还款 " + money(amt) + "，剩余负债 " + money(S.debt) + "。", "ok");
    });

      S.cash -= cost; S.totals.capex += cost; S.level += 1;
      renderHud(); updateCard();
      setShop(S.level);
      toast("门店 LV." + S.level + " · " + SHOP_NAMES[S.level] + "：客流 +" + pct(UP_DEMAND) + "，产能 +" + CAP_PER_LEVEL + "，月租 +" + money(RENT_PER_LVL) + "。", "ok");
      const shopMsg = push("zhen",
        '<img class="scene" src="assets/shop' + S.level + '.webp" alt="门店 LV.' + S.level + '">' +
        '<div class="ev-r">店面翻新好了 —— <b>' + SHOP_NAMES[S.level] + '</b>。客流 <b>+' + pct(UP_DEMAND) +

  function effMkt() {
    const m = parseFloat(el("d_mkt").value) || 0;
    return S.mktStock * MKT_CARRY + m * (1 - MKT_CARRY);
  }

  function readCard() {
    const d = { price: {}, order: {}, mkt: parseFloat(el("d_mkt").value) || 0 };
    const cm = mulOf("cost");
    let purchase = 0;
    SKUS.forEach(s => {
      const p = parseFloat(el("d_price_" + s.id).value);
      const o = parseFloat(el("d_order_" + s.id).value);
      d.price[s.id] = (isFinite(p) && p >= 1) ? p : s.ref;
      d.order[s.id] = (isFinite(o) && o >= 0) ? Math.round(o) : 0;
      purchase += d.order[s.id] * s.cost * cm;
    });
    d.purchase = purchase;
    return d;
  }

  function updateCard() {
    if (!cardNode) return;
    const cap = capacity();
    const f = forecast(effMkt());
    const ratio = f.__total > cap ? cap / f.__total : 1;
    const cm = mulOf("cost");

    SKUS.forEach(s => {
      const price = parseFloat(el("d_price_" + s.id).value) || s.ref;
      const order = parseFloat(el("d_order_" + s.id).value) || 0;
      const served = f[s.id] * ratio;
      const sellable = Math.min(served, S.inv[s.id] + order);
      const gp = sellable * (price - s.cost * cm);
      el("d_pd_" + s.id).textContent = "预计 " + Math.round(f[s.id]) + " 件";
      const pg = el("d_pg_" + s.id);
      pg.textContent = "毛利 " + money(gp);
      pg.className = gp >= 0 ? "gold" : "red";
    });

    el("d_staff").textContent = S.staff;
    el("d_wage").textContent = money(wageNow());

    const capEl = el("d_cap");
    capEl.textContent = "产能 " + cap + " · 需求 " + Math.round(f.__total);
    capEl.style.color = f.__total > cap ? "var(--red)" : "var(--dim2)";

    const upBtn = el("d_up");
    if (S.level >= MAX_LEVEL) { upBtn.textContent = "门店已满级"; upBtn.disabled = true; }
    else { upBtn.textContent = "升级 " + money(UP_COST[S.level]); upBtn.disabled = false; }

    const d = readCard();
    const out = d.purchase + d.mkt;
    const short = out - S.cash;
    const cc = el("d_calc");
    if (short > 0.5) {
      cc.innerHTML = '需支出 <b class="c-red">' + money(out) + '</b> · 现金缺口 <b class="c-red">' +
        money(short) + "</b> —— 少订点货，或者先借。";
    } else {
      cc.innerHTML = "本月支出 <b>" + money(out) + "</b>（进货 " + money(d.purchase) + " + 营销 " +
        money(d.mkt) + "），结算后余 " + money(S.cash - out) + "。";
    }
  }

  /* ================= 结算 ================= */
  function commit(d) {
    const cm = mulOf("cost");
    const spend = d.mkt;
    const mktEff = S.mktStock * MKT_CARRY + spend * (1 - MKT_CARRY);

    SKUS.forEach(s => {
      S.inv[s.id] += d.order[s.id];
      S.lastOrder[s.id] = d.order[s.id];
      S.prices[s.id] = d.price[s.id];
    });
    S.cash -= d.purchase;
    S.cash -= spend;
    S.mktStock = mktEff;

    const cap = capacity();
    const ds = {};
    let totalD = 0;
    SKUS.forEach(s => {
      const v = demandFor(s, S.prices[s.id], mktEff, 0.9 + Math.random() * 0.2);
      ds[s.id] = v;
      totalD += v;
    });

    const ratio = totalD > cap ? cap / totalD : 1;
    let revenue = 0, cogs = 0, sold = 0, lostCap = 0, lostStock = 0;
    SKUS.forEach(s => {
      const dm = ds[s.id];
      const served = dm * ratio;
      const sv = Math.min(served, S.inv[s.id]);
      S.inv[s.id] -= sv;
      revenue += sv * S.prices[s.id];
      cogs += sv * s.cost * cm;
      sold += sv;
      lostCap += dm - served;
      lostStock += Math.max(0, served - sv);
    });
    S.cash += revenue;

    const rent = rentNow(), wages = wageNow();
    const iv = invValue();
    const hold = iv * HOLD_RATE;
    const interest = S.debt * LOAN_RATE;
    const opex = rent + wages + hold + interest + spend;
    S.cash -= (rent + wages + hold + interest);

    const gross = revenue - cogs;
    const profit = gross - opex;

    const fillRate = totalD > 1e-6 ? sold / totalD : 1;
    const repDelta = fillRate >= 0.98 ? 1.5 : -(1 - fillRate) * 25;
    S.rep = clamp(S.rep + repDelta + (60 - S.rep) * 0.03, 5, 100);

    let autoBorrow = 0;
    if (S.cash < -0.5) {
      const need = -S.cash;
      const room = LOAN_LIMIT - S.debt;
      if (room >= need) { S.debt += need; S.cash = 0; autoBorrow = need; }
      else { S.cash += room; S.debt = LOAN_LIMIT; }
    }

    S.compIndex = clamp(S.compIndex + (Math.random() - 0.5) * 0.04, 0.86, 1.18);

    const mktFactor = 1 + 0.28 * Math.log2(1 + mktEff / 3000);
    const incrGross = gross * (1 - 1 / mktFactor);

    const r = {
      month: S.month, revenue, cogs, gross, opex, profit,
      rent, wages, hold, interest, spend, cash: S.cash, inv: iv, net: netWorth(),
      sold, totalDemand: totalD, lostCap, lostStock, fillRate,
      grossMargin: revenue > 0 ? gross / revenue : 0,
      mktRoi: spend > 0 ? (incrGross - spend) / spend : 0,
      autoBorrow, cap
    };

    S.totals.revenue += revenue; S.totals.profit += profit; S.totals.cogs += cogs;
    S.totals.lost += lostCap + lostStock; S.totals.mkt += spend; S.totals.units += sold;
    S.history.push({ month: S.month, cash: S.cash, net: netWorth(), profit });
    if (netWorth() > S.peakNet) S.peakNet = netWorth();

    S.mods.forEach(m => { m.left -= 1; });
    S.mods = S.mods.filter(m => m.left > 0);

    S.month += 1;
    return r;
  }

  /* ================= 消息内容 ================= */
  function summaryHtml(d) {
    const lines = SKUS.map(s =>
      s.name + " 定价 <b>" + money(d.price[s.id]) + "</b>、进 " + d.order[s.id] + " 件");

    return h;
  }

  function coachHtml(r) {
    const cap = r.cap;
    const util = r.totalDemand > 0 ? Math.min(1, cap / r.totalDemand) : 1;
    const trueUtil = r.totalDemand > 0 ? r.sold / cap : 0;
    const t = [];

    if (r.autoBorrow > 0)

  /* ================= 图表 ================= */
  function drawMini(cv) {
    if (!cv || !cv.parentNode) return;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 300, h = cv.clientHeight || 74;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const pts = S.history;
    if (pts.length < 2) return;
    const padL = 2, padR = 2, padT = 7, padB = 4;
    const iw = w - padL - padR, ih = h - padT - padB;
    let mn = Infinity, mx = -Infinity;
    pts.forEach(p => { mn = Math.min(mn, p.cash, p.net); mx = Math.max(mx, p.cash, p.net); });
    if (mx - mn < 1) mx = mn + 1000;
    const pad = (mx - mn) * 0.15;
    mn -= pad; mx += pad;
    const xOf = i => padL + (i / (pts.length - 1)) * iw;
    const yOf = v => padT + ih - ((v - mn) / (mx - mn)) * ih;

    ctx.strokeStyle = "#1b232e"; ctx.lineWidth = 1;
    for (let g = 0; g <= 2; g++) {
      const gy = padT + (ih / 2) * g;
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL + iw, gy); ctx.stroke();
    }

    [["net", "#48c8ef"], ["cash", "#f3b544"]].forEach(s => {
      ctx.beginPath();
      pts.forEach((p, i) => { i === 0 ? ctx.moveTo(xOf(i), yOf(p[s[0]])) : ctx.lineTo(xOf(i), yOf(p[s[0]])); });
      ctx.strokeStyle = s[1]; ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.stroke();
      const g = ctx.createLinearGradient(0, padT, 0, padT + ih);
      g.addColorStop(0, s[1] + "2e"); g.addColorStop(1, s[1] + "00");
      ctx.lineTo(xOf(pts.length - 1), padT + ih); ctx.lineTo(xOf(0), padT + ih);
      ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    });
  }

  function endGame(bankrupt) {
    if (S.gameOver) return;
    S.gameOver = true;
    if (cardNode && cardNode.parentNode) cardNode.parentNode.removeChild(cardNode);
    cardNode = null;

    const nw = netWorth();
    const sn = startNet();
    const roi = (nw - sn) / sn;

    let grade, sub;
    if (bankrupt || nw < 0) { grade = "出 局"; sub = "BANKRUPT"; }
    else if (nw < 60000) { grade = "街边学徒"; sub = "APPRENTICE"; }
    else if (nw < 120000) { grade = "小老板"; sub = "SHOPKEEPER"; }
    else if (nw < 240000) { grade = "掌 柜"; sub = "MANAGER"; }
    else if (nw < 420000) { grade = "商 人"; sub = "MERCHANT"; }

    const avgMargin = S.totals.revenue > 0 ? (S.totals.revenue - S.totals.cogs) / S.totals.revenue : 0;

      { wide: true });
    await sleep(700);
    await typing("zhou", 500);
    push("zhou", "我是老周，负责每个月末给你泼冷水。先说清楚：这里没有「随便点点就赢」。定价、备货、产能、现金，四个变量互相咬着，动一个，另外三个都会响。我只告诉你哪儿出了问题，怎么改，你自己想。");
    await sleep(720);
    startMonth();
  }

  function boot() {
    el("btnLore").addEventListener("click", showLore);
    el("btnShop").addEventListener("click", showShop);
    el("stream").addEventListener("click", e => {
      if (e.target && e.target.classList && e.target.classList.contains("scene")) showShop();
    });
    restart();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
